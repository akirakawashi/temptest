# Изолированный файловый стенд. Обычный речевой монитор не запускается.
name: speech-comparison

services:
  whisper-client:
    build:
      context: .
      dockerfile: Dockerfile.whisper-client
      network: ${BENCH_BUILD_NETWORK:-default}
      args:
        WHISPER_IMAGE: ${BENCH_WHISPER_IMAGE:-hwdsl2/whisper-server@sha256:de716f26601229179eb4ba62d07e7a5ed4167c5290786281cd06535fdf2a97d6}
    image: speech-comparison:4.0.0-whisper-standalone
    platform: linux/amd64
    init: true
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: 2g
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      BENCH_THREADS: ${BENCH_THREADS:-4}
      BENCH_GPU: ${BENCH_GPU:-0}
      BENCH_GPU_MIN_FREE_MIB: ${BENCH_GPU_MIN_FREE_MIB:-16384}
      BENCH_GPU_MAX_UTIL: ${BENCH_GPU_MAX_UTIL:-10}
      BENCH_GPU_RESERVE_MIB: ${BENCH_GPU_RESERVE_MIB:-4096}
      BENCH_MIN_RAM_MIB: ${BENCH_MIN_RAM_MIB:-20480}
      # Адрес фиксирован: старые URL/ключ прода из .env игнорируются.
      WHISPER_API_BASE_URL: http://whisper-bench:9000/v1
      BENCH_WHISPER_MODEL: ${BENCH_WHISPER_MODEL:-large-v3}
      BENCH_WHISPER_IMAGE: ${BENCH_WHISPER_IMAGE:-hwdsl2/whisper-server@sha256:de716f26601229179eb4ba62d07e7a5ed4167c5290786281cd06535fdf2a97d6}
      BENCH_API_GAP: ${BENCH_API_GAP:-5}
      BENCH_API_TIMEOUT: ${BENCH_API_TIMEOUT:-1200}
      BENCH_EXPECTED_FILES: ${BENCH_EXPECTED_FILES:-100}
      TZ: Europe/Moscow
    volumes:
      - ${BENCH_AUDIO_DIR:?Укажите папку записей}:/recordings:ro
      - ${BENCH_OUT:?Укажите папку отчётов}:/results
    networks: [whisper]

  audio-prepare:
    # Тот же PyAV/NumPy, что подготовил WAV для Whisper; без ASR и сети.
    image: speech-comparison:4.0.0-whisper-standalone
    platform: linux/amd64
    entrypoint: ["python", "-m", "benchmark.compare"]
    command: []
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: 2g
    network_mode: none
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      BENCH_THREADS: ${BENCH_THREADS:-4}
      BENCH_EXPECTED_FILES: ${BENCH_EXPECTED_FILES:-100}
      BENCH_GPU: ${BENCH_GPU:-0}
      BENCH_GPU_MIN_FREE_MIB: ${BENCH_GPU_MIN_FREE_MIB:-16384}
      BENCH_GPU_MAX_UTIL: ${BENCH_GPU_MAX_UTIL:-10}
      BENCH_GPU_RESERVE_MIB: ${BENCH_GPU_RESERVE_MIB:-4096}
      BENCH_MIN_RAM_MIB: ${BENCH_MIN_RAM_MIB:-20480}
      TZ: Europe/Moscow
    volumes:
      - ${BENCH_AUDIO_DIR:?Укажите папку записей}:/recordings:ro
      - ${BENCH_OUT:?Укажите папку отчётов}:/results

  whisper-bench:
    image: speech-comparison:4.0.0-whisper-standalone
    platform: linux/amd64
    entrypoint: ["python", "-m", "benchmark.whisper_server"]
    command: []
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: 8g
    tmpfs:
      - /tmp:uid=${BENCH_UID:-1000},gid=${BENCH_GID:-1000},mode=0700
    environment:
      WHISPER_MODEL: ${BENCH_WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_LOCAL_ONLY: "1"
      WHISPER_LANGUAGE: ru
      WHISPER_THREADS: ${BENCH_WHISPER_THREADS:-2}
      WHISPER_BEAM: ${BENCH_WHISPER_BEAM:-5}
      WHISPER_DIARIZATION: "false"
      WHISPER_WORD_TIMESTAMPS: "false"
      WHISPER_API_KEY: ""
      HF_HOME: /var/lib/whisper
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      BENCH_GPU_RESERVE_MIB: ${BENCH_GPU_RESERVE_MIB:-4096}
      BENCH_WHISPER_IMAGE: ${BENCH_WHISPER_IMAGE:-hwdsl2/whisper-server@sha256:de716f26601229179eb4ba62d07e7a5ed4167c5290786281cd06535fdf2a97d6}
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Europe/Moscow
    volumes:
      - ${BENCH_CACHE:?Укажите папку кеша моделей}/whisper:/var/lib/whisper:ro
    networks: [whisper]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health',timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 200
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BENCH_GPU:-0}"]
              capabilities: [gpu]

  whisper-download:
    image: speech-comparison:4.0.0-whisper-standalone
    platform: linux/amd64
    entrypoint: ["python", "-m", "benchmark.whisper_server"]
    command: ["--download"]
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    cpus: "${BENCH_THREADS:-4}"
    mem_limit: 2g
    # Только скачивание публичных весов: ни GPU, ни записей, ни сервера API.
    network_mode: ${BENCH_DOWNLOAD_NETWORK:-host}
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      WHISPER_MODEL: ${BENCH_WHISPER_MODEL:-large-v3}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TZ: Europe/Moscow
    volumes:
      - ${BENCH_CACHE:?Укажите папку кеша моделей}/whisper:/var/lib/whisper

  compare:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
      network: ${BENCH_BUILD_NETWORK:-default}
      args:
        WHISPER_IMAGE: ${BENCH_WHISPER_IMAGE:-hwdsl2/whisper-server@sha256:de716f26601229179eb4ba62d07e7a5ed4167c5290786281cd06535fdf2a97d6}
    image: speech-comparison:4.0.0-gigaam-cuda
    platform: linux/amd64
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: ${BENCH_WORKER_MEMORY:-8g}
    environment:
      BENCH_THREADS: ${BENCH_THREADS:-4}
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: ${BENCH_THREADS:-4}
      MKL_NUM_THREADS: ${BENCH_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${BENCH_THREADS:-4}
      BENCH_GPU: ${BENCH_GPU:-0}
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      BENCH_GPU_RESERVE_MIB: ${BENCH_GPU_RESERVE_MIB:-4096}
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-hf.co/ai-sage/GigaChat3.1-10B-A1.8B-GGUF:Q4_K_M}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_AUTOPULL: "false"
      VAD_THRESHOLD: ${VAD_THRESHOLD:-0.5}
      VAD_MIN_SILENCE: ${VAD_MIN_SILENCE:-0.45}
      VAD_MAX_SPEECH: ${VAD_MAX_SPEECH:-15}
      SPEAKER_THRESHOLD: ${SPEAKER_THRESHOLD:-0.45}
      MAX_SPEAKERS: ${MAX_SPEAKERS:-5}
      SPLIT_TURNS: ${SPLIT_TURNS:-true}
      TZ: Europe/Moscow
    volumes:
      - ${BENCH_AUDIO_DIR:?Укажите папку записей}:/recordings:ro
      - ${BENCH_OUT:?Укажите папку отчётов}:/results
      - ${BENCH_CACHE:?Укажите папку кеша моделей}:/cache
    depends_on:
      - ollama
    networks: [gigaam]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BENCH_GPU:-0}"]
              capabilities: [gpu]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: ${BENCH_LLM_MEMORY:-10g}
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NO_CLOUD: "1"
    networks: [gigaam]
    volumes:
      - comparison-ollama:/root/.ollama
    # Та же GPU, что у compare; порт доступен только внутри стенда.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BENCH_GPU:-0}"]
              capabilities: [gpu]

  prefetch:
    image: speech-comparison:4.0.0-gigaam-cuda
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}"
    cpus: "${BENCH_THREADS:-4}"
    cpuset: "${BENCH_CPUSET:-0-3}"
    mem_limit: 8g
    network_mode: ${BENCH_DOWNLOAD_NETWORK:-host}
    entrypoint: ["python", "-m", "benchmark.prefetch"]
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      EMO_CACHE: /cache/gigaam
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ${BENCH_CACHE:?Укажите папку кеша моделей}:/cache

  ollama-download:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    mem_limit: 2g
    network_mode: ${BENCH_DOWNLOAD_NETWORK:-host}
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      # При host-сети API подготовки слушает только loopback и другой порт.
      OLLAMA_HOST: "127.0.0.1:${BENCH_OLLAMA_DOWNLOAD_PORT:-11435}"
      OLLAMA_NO_CLOUD: "1"
      LLM_MODEL: ${LLM_MODEL:-hf.co/ai-sage/GigaChat3.1-10B-A1.8B-GGUF:Q4_K_M}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - comparison-ollama:/root/.ollama

networks:
  whisper:
    internal: true
  gigaam:
    internal: true

volumes:
  comparison-ollama:
